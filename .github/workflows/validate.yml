name: Validate repository

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile scripts and tests
        run: python -m compileall -q scripts tests
      - name: Run synthetic-only tests
        run: python -m pytest -q
      - name: Enforce public-data boundary
        run: |
          if git grep -n -I -E 'Subject ?1|Subject ?2|subject1|subject2|[0-9]{3}_S_[0-9]{4}|(^|[^A-Za-z0-9])I[0-9]{5}([^0-9]|$)' -- ':!.github/workflows/validate.yml'; then
            echo "Restricted participant label or identifier found."
            exit 1
          fi
          if git ls-files | grep -E '\.(nii|nii\.gz|mgz|mgh)$'; then
            echo "Medical-image file found in the public tree."
            exit 1
          fi
          if git grep -n -I -E '(/mnt/[A-Za-z]/|[A-Za-z]:\\)' -- ':!.github/workflows/validate.yml'; then
            echo "Absolute workstation path found in a tracked text file."
            exit 1
          fi
      - name: Validate manifests and result schemas
        shell: python
        run: |
          import csv
          import json
          from pathlib import Path

          config = json.loads(Path("config/public_dataset.json").read_text())
          assert config["dataset_id"] == "ds005125"
          assert config["snapshot"] == "1.0.0"
          assert config["license"] == "CC0-1.0"

          required = {
              "participant", "condition", "mode", "runtime_seconds", "label_count",
              "clean_reference_macro_dice", "mean_absolute_volume_drift_pct",
              "median_absolute_volume_drift_pct",
          }
          public_csv = Path("results/public/subject_level/results.csv")
          if public_csv.exists():
              with public_csv.open(newline="", encoding="utf-8") as handle:
                  rows = list(csv.DictReader(handle))
              if len(rows) != 64 or not rows or not required <= set(rows[0]):
                  raise SystemExit("Public result CSV is incomplete or has the wrong schema")
              expected = {
                  Path("results/public/aggregate/summary.csv"),
                  Path("results/public/aggregate/cohort_summary.csv"),
                  Path("figures/public/clean_reference_dice.png"),
                  Path("figures/public/mean_volume_drift.png"),
                  Path("figures/public/public_qc_contact_sheet.png"),
              }
              missing = [str(path) for path in expected if not path.is_file() or path.stat().st_size == 0]
              if missing:
                  raise SystemExit("Completed public results are missing artifacts: " + ", ".join(missing))

          for path in (
              Path("results/restricted/phase2/aggregate_macro_dice.csv"),
              Path("results/restricted/phase2/aggregate_volume_drift.csv"),
          ):
              with path.open(newline="", encoding="utf-8") as handle:
                  if not list(csv.DictReader(handle)):
                      raise SystemExit(f"Empty approved aggregate: {path}")
